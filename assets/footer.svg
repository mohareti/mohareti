<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Stay curious, stay secure">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#000000"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9c"/><stop offset="1" stop-color="#00c2ff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="90" rx="14"/></clipPath>
</defs>
<style>
.beam{animation:run 4s linear infinite}
@keyframes run{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
.t{font:600 18px Consolas,'SF Mono',Menlo,monospace;fill:#7d8da1;letter-spacing:2px}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="90" fill="url(#bg)"/>
<line x1="0" y1="2" x2="1200" y2="2" stroke="#1f4c5e" stroke-width="2"/>
<rect class="beam" x="0" y="0" width="400" height="3" fill="url(#beam)"/>
<text x="600" y="54" text-anchor="middle" class="t">// stay curious · stay secure <tspan fill="#00ff9c" class="cur">█</tspan></text>
<rect x="1" y="1" width="1198" height="88" rx="14" fill="none" stroke="#1f4c5e" stroke-width="2"/>
</g>
</svg>
