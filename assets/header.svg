.scan{animation:sweep 5s linear infinite}
@keyframes sweep{0%{transform:translateY(-80px)}100%{transform:translateY(320px)}}
.in{opacity:0;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
